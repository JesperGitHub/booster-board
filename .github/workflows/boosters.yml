name: Update boosters

on:
  schedule:
    - cron: "17 */6 * * *"     # every 6 hours
  workflow_dispatch:            # "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Get boosters from Discord
        run: python update_boosters.py
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
      - name: Save boosters.txt
        run: |
          git config user.name "booster-bot"
          git config user.email "booster-bot@users.noreply.github.com"
          git add boosters.txt
          git diff --cached --quiet || (git commit -m "Update boosters" && git push)
