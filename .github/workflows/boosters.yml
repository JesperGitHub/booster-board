name: Update boosters

on:
  schedule:
    - cron: "*/30 * * * *"     # every 30 minutes
  workflow_dispatch:            # "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Get boosters from Discord
        run: python update_boosters.py
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
          LINK_SALT: ${{ secrets.LINK_SALT }}
      - name: Save the lists
        run: |
          git config user.name "booster-bot"
          git config user.email "booster-bot@users.noreply.github.com"
          git add boosters.txt boosters_vrc.txt
          git diff --cached --quiet || (git commit -m "Update boosters" && git push)
